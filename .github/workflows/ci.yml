name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Pinned: ubuntu-latest moved to Ubuntu 26, where Playwright 1.56 cannot install its browser deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
